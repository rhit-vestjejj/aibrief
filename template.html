<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Brief</title>
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AI Brief">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#fff;--ink:#000;--muted:#6e6e73;--sep:#d2d2d7;--blue:#0066cc;--read:#86868b;--hair:1px}
@media (min-resolution:2dppx){:root{--hair:.5px}}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#f5f5f7;--muted:#98989d;--sep:#38383a;--blue:#2997ff;--read:#6e6e73}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:var(--blue);background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 40px)}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0}
.date{margin:2px 0 0;font-size:15px;color:var(--muted)}
.toggle{font-size:15px;padding:8px 0 8px 12px;margin-top:4px;white-space:nowrap}

.tabs{position:sticky;top:0;z-index:2;display:flex;gap:24px;overflow-x:auto;scrollbar-width:none;margin:14px -20px 0;padding:0 20px;background:var(--bg);border-bottom:var(--hair) solid var(--sep)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:15px;font-weight:600;color:var(--muted);padding:12px 0 10px;border-bottom:2px solid transparent}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}

.brief{padding-top:22px}
.brief h2{font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
.brief ul{margin:0;padding-left:20px}
.brief li{margin:0 0 8px;line-height:1.4}
.brief li::marker{color:var(--muted)}
.must{display:block;margin-top:16px}
.must-label{display:block;font-size:13px;color:var(--muted)}
.must-title{display:block;font-weight:600;color:var(--blue);margin-top:2px}
.must-why{display:block;font-size:15px;color:var(--muted);margin-top:2px}

.sec{margin-top:32px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:8px;border-bottom:var(--hair) solid var(--sep)}
.sec h2{font-size:20px;line-height:1.2;font-weight:700;margin:0}
.mark{font-size:15px;white-space:nowrap}
.sec:has(.empty) .mark{display:none}
.sec ul{list-style:none;margin:0;padding:0}
.item{border-bottom:var(--hair) solid var(--sep)}
.item a{display:block;padding:12px 0}
.item a:active{opacity:.5}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:3px}
.src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta time{flex:none}
.title{display:block;font-weight:600;line-height:1.3}
.item.read .title{color:var(--read);font-weight:400}
body.hide-read .item.read{display:none}
.empty{padding:12px 0;font-size:15px;color:var(--muted);border-bottom:var(--hair) solid var(--sep)}
.chips{display:flex;flex-wrap:wrap;gap:10px 20px;padding-top:12px}
.chip{font-size:15px;color:var(--blue)}

footer{margin-top:36px;font-size:13px;line-height:1.4;color:var(--muted)}
footer p{margin:0 0 6px}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>AI Brief</h1><p class="date" id="date"></p></div>
    <button class="toggle" id="hide" type="button" aria-pressed="false">Hide read</button>
  </header>
  {{BODY}}
  <footer><p id="when"></p>{{ERRORS}}</footer>
</main>
<script>
(function(){
  var KEY="aibrief-read", PREF="aibrief-hide", TAB="aibrief-tab";
  function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function ago(t){var m=Math.max(0,Math.round((Date.now()-new Date(t))/6e4));
    if(m<1)return "Just now";if(m<60)return m+"m ago";var h=Math.floor(m/60);if(h<24)return h+"h ago";var d=Math.floor(h/24);return d===1?"Yesterday":d+"d ago"}
  var updated=new Date("{{UPDATED}}");
  document.getElementById("date").textContent=updated.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  document.getElementById("when").textContent="Updated "+ago(updated).toLowerCase()+".";
  document.querySelectorAll("time").forEach(function(t){t.textContent=ago(t.getAttribute("datetime"))});

  var tabs=[].slice.call(document.querySelectorAll(".tab"));
  function show(id){
    if(!tabs.length)return;
    if(!tabs.some(function(b){return b.dataset.tab===id}))id=tabs[0].dataset.tab;
    tabs.forEach(function(b){var on=b.dataset.tab===id;b.setAttribute("aria-selected",on);document.getElementById("p-"+b.dataset.tab).hidden=!on});
    save(TAB,id);
  }
  tabs.forEach(function(b){b.addEventListener("click",function(){
    show(b.dataset.tab);try{history.replaceState(null,"","#"+b.dataset.tab)}catch(e){}window.scrollTo(0,0)})});
  window.addEventListener("hashchange",function(){show(location.hash.slice(1))});
  show(location.hash.slice(1)||load(TAB,""));

  var read=load(KEY,{});
  var cut=Date.now()-45*864e5;for(var k in read){if(read[k]<cut)delete read[k]}save(KEY,read);
  function paint(){document.querySelectorAll(".item").forEach(function(li){li.classList.toggle("read",!!read[li.dataset.id])})}
  function mark(li){read[li.dataset.id]=Date.now()}
  document.querySelectorAll(".item a").forEach(function(a){a.addEventListener("click",function(){mark(a.parentNode);save(KEY,read);setTimeout(paint,300)})});
  document.querySelectorAll(".mark").forEach(function(b){b.addEventListener("click",function(){
    b.closest(".sec").querySelectorAll(".item").forEach(mark);save(KEY,read);paint()})});

  var hide=document.getElementById("hide");
  function setHide(on){document.body.classList.toggle("hide-read",on);hide.setAttribute("aria-pressed",on);hide.textContent=on?"Show read":"Hide read";save(PREF,on)}
  hide.addEventListener("click",function(){setHide(!document.body.classList.contains("hide-read"))});
  setHide(load(PREF,false));paint();
  if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
</body>
</html>
