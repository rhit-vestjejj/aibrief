<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Brief</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Brief">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--muted:#6b6a66;--line:#e4e2dc;--accent:#c4562f;--accent-soft:#f6e6df;--read:#a9a7a1;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--muted:#9a9891;--line:#2e2d2a;--accent:#e07a52;--accent-soft:#3a2519;--read:#5f5d58;--on-accent:#141413}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 40px)}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
h1{font-size:30px;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.toggle{font:inherit;font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.toggle[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:22px}
.summary h2{font-size:19px;margin:0 0 8px;letter-spacing:-.01em}
.summary ul{margin:0;padding-left:18px}.summary li{margin:6px 0}
.must{display:block;margin-top:14px;padding:12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);text-decoration:none}
.must .lbl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.must strong{display:block;margin:2px 0}.must span:last-child{font-size:14px;color:var(--muted)}
.sec{margin-bottom:26px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.mark{font:inherit;font-size:13px;color:var(--accent);background:none;border:0;padding:4px 0}
.sec ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item+.item{border-top:1px solid var(--line)}
.item a{display:block;padding:12px 14px;color:inherit;text-decoration:none;min-height:44px}
.item a:active{background:var(--line)}
.meta{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-bottom:2px}
.src{color:var(--accent);font-weight:600}
.title{font-weight:500}
.item.read .title,.item.read .src{color:var(--read);font-weight:400}
body.hide-read .item.read{display:none}
.empty{padding:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.err{font-size:12px;color:var(--muted)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:3}
.tabs{position:sticky;top:env(safe-area-inset-top);z-index:2;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:var(--bg);margin:-8px -16px 14px;padding:8px 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;font-size:14px;font-weight:500;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px;min-height:40px}
.tab[aria-selected=true]{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.tab .n{margin-left:6px;font-size:12px;opacity:.75}
.tab .n:empty{display:none}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>AI Brief</h1><div class="sub"><span id="when"></span> · {{TOTAL}} items</div></div>
    <button class="toggle" id="hide" type="button" aria-pressed="false">Hide read</button>
  </header>
  {{BODY}}
  {{ERRORS}}
</main>
<script>
(function(){
  var KEY="aibrief-read", PREF="aibrief-hide";
  function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var read=load(KEY,{});
  function ago(t){var m=Math.round((Date.now()-new Date(t))/6e4);
    if(m<60)return m+"m ago";var h=Math.round(m/60);if(h<48)return h+"h ago";return Math.round(h/24)+"d ago"}
  document.getElementById("when").textContent="Updated "+ago("{{UPDATED}}");
  document.querySelectorAll("time").forEach(function(t){t.textContent=ago(t.getAttribute("datetime"))});
  var TAB="aibrief-tab", tabs=[].slice.call(document.querySelectorAll(".tab"));
  function panel(b){return document.getElementById("p-"+b.dataset.tab)}
  function show(id){
    if(!tabs.length)return;
    if(!tabs.some(function(b){return b.dataset.tab===id}))id=tabs[0].dataset.tab;
    tabs.forEach(function(b){var on=b.dataset.tab===id;b.setAttribute("aria-selected",on);panel(b).hidden=!on});
    save(TAB,id);
  }
  tabs.forEach(function(b){b.addEventListener("click",function(){
    show(b.dataset.tab);try{history.replaceState(null,"","#"+b.dataset.tab)}catch(e){}window.scrollTo(0,0)})});
  window.addEventListener("hashchange",function(){show(location.hash.slice(1))});
  show(location.hash.slice(1)||load(TAB,""));
  function badges(){tabs.forEach(function(b){var n=panel(b).querySelectorAll(".item:not(.read)").length;b.querySelector(".n").textContent=n||""})}
  function paint(){document.querySelectorAll(".item").forEach(function(li){li.classList.toggle("read",!!read[li.dataset.id])});badges()}
  function mark(li){read[li.dataset.id]=Date.now()}
  document.querySelectorAll(".item a").forEach(function(a){a.addEventListener("click",function(){mark(a.parentNode);save(KEY,read);setTimeout(paint,300)})});
  document.querySelectorAll(".mark").forEach(function(b){b.addEventListener("click",function(){
    b.closest(".sec").querySelectorAll(".item").forEach(mark);save(KEY,read);paint()})});
  var cut=Date.now()-45*864e5;for(var k in read){if(read[k]<cut)delete read[k]}save(KEY,read);
  var hide=document.getElementById("hide");
  function setHide(on){document.body.classList.toggle("hide-read",on);hide.setAttribute("aria-pressed",on);save(PREF,on)}
  hide.addEventListener("click",function(){setHide(!document.body.classList.contains("hide-read"))});
  setHide(load(PREF,false));paint();
  if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
</body>
</html>
