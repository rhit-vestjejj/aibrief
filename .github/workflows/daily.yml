name: Build AI Brief
run-name: ${{ (github.event_name == 'schedule' || inputs.morning) && 'Morning brief' || 'Build AI Brief' }}

on:
  # The main morning trigger is an outside cron service that calls workflow_dispatch with
  # morning=true (see README), because GitHub's own scheduler can skip runs entirely.
  # These GitHub schedules are a backup. Every morning run skips itself if today's brief already went out.
  schedule:
    - cron: "40 10 * * *"   # 10:40 UTC = 4:40 AM CST / 5:40 AM CDT
    - cron: "25 11 * * *"   # 11:25 UTC = 5:25 AM CST / 6:25 AM CDT
  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      morning:
        description: "Morning run: skip if today's morning brief already went out"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # runs wait for each other, so the backup sees the main run's result

jobs:
  check:
    # A morning run builds only if no other morning run has succeeded yet today (UTC).
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MORNING: ${{ github.event_name == 'schedule' || inputs.morning }}
        run: |
          build=true
          if [ "$MORNING" = true ]; then
            done=$(gh run list -R "$GITHUB_REPOSITORY" -w daily.yml -s success -L 50 \
                     --created ">=$(date -u +%F)" --json databaseId,displayTitle \
                     --jq "map(select(.displayTitle == \"Morning brief\" and .databaseId != $GITHUB_RUN_ID)) | length")
            if [ "$done" -gt 0 ]; then build=false; echo "Today's brief already ran; skipping."; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      note: ${{ steps.build.outputs.note }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page
        id: build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: enables AI summary
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-5-5' }}
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Separate job, so the notification only goes out once the page is live,
    # and a failed deploy can be re-run without rebuilding.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Send notification
        env:
          NOTE: ${{ needs.build.outputs.note }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional: morning push notification
          SITE_URL: ${{ vars.SITE_URL }}          # optional: notification tap target
        run: python3 build.py --notify
