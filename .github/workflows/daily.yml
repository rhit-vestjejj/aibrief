name: Build AI Brief

on:
  schedule:
    # GitHub often delays or drops runs at the top of the hour, so use odd minutes.
    - cron: "40 10 * * *"   # main:   10:40 UTC = 4:40 AM CST / 5:40 AM CDT
    - cron: "25 11 * * *"   # backup: 11:25 UTC = 5:25 AM CST / 6:25 AM CDT (skips if main ran)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # runs wait for each other, so the backup sees the main run's result

jobs:
  check:
    # The backup slot builds only if no scheduled run has succeeded yet today.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            done=$(gh run list -R "$GITHUB_REPOSITORY" -w daily.yml -e schedule -s success \
                     --created ">=$(date -u +%F)" --json databaseId \
                     --jq "map(select(.databaseId != $GITHUB_RUN_ID)) | length")
            if [ "$done" -gt 0 ]; then build=false; echo "Today's brief already ran; skipping."; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      note: ${{ steps.build.outputs.note }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page
        id: build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: enables AI summary
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-5-5' }}
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Separate job, so the notification only goes out once the page is live,
    # and a failed deploy can be re-run without rebuilding.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Send notification
        env:
          NOTE: ${{ needs.build.outputs.note }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional: morning push notification
          SITE_URL: ${{ vars.SITE_URL }}          # optional: notification tap target
        run: python3 build.py --notify
