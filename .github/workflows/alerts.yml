name: Breaking news alerts

on:
  # Started every 15 minutes during the day by an outside cron service (see README),
  # because GitHub's own scheduler skips runs for this repo.
  workflow_dispatch:
    inputs:
      test:
        description: "Send a sample alert instead of checking the news"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # alerts_state.json remembers sent alerts for 48 hours; the cache carries it between runs.
      - uses: actions/cache/restore@v4
        with:
          path: alerts_state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-
      - name: Check for huge news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-5-5' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 alerts.py ${{ inputs.test && '--test' || '' }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('alerts_state.json') != ''
        with:
          path: alerts_state.json
          key: alerts-state-${{ github.run_id }}
